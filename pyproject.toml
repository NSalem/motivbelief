[project]
name = "motivbelief"
version = "0.1.0"
dependencies = [
  "pandas>=2.0",
  "numpy>=1.24",
  "scipy>=1.10",
  "statsmodels>=0.14",
  "tabulate>=0.9",
  "matplotlib>=3.7",
  "pybads>=1.0",
  "numba>=0.58",
  "threadpoolctl>=3.0",
  "groupBMC>=1.0",
]
requires-python = ">=3.9"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
